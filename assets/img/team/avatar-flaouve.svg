<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="flaouve-title flaouve-desc">
  <title id="flaouve-title">Flaouve — Chief &amp; Site Director Avatar</title>
  <desc id="flaouve-desc">Dark editorial framed profile emblem for Flaouve featuring orthogonal server telemetry grid lines, orbital arcs, crimson status nodes, and a minimalist silhouette bust.</desc>
  <defs>
    <radialGradient id="flaouve-bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#131820"/>
      <stop offset="68%" stop-color="#0d1015"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>
    <clipPath id="flaouve-clip">
      <circle cx="60" cy="60" r="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#flaouve-clip)">
    <rect width="120" height="120" fill="url(#flaouve-bg)"/>

    <!-- Infrastructure / Server Matrix Hairlines -->
    <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" fill="none">
      <line x1="20" y1="30" x2="100" y2="30"/>
      <line x1="20" y1="48" x2="100" y2="48"/>
      <line x1="20" y1="66" x2="100" y2="66"/>
      <line x1="32" y1="12" x2="32" y2="108"/>
      <line x1="88" y1="12" x2="88" y2="108"/>
    </g>

    <!-- Orbital Node Ring & Telemetry Nodes -->
    <circle cx="60" cy="52" r="32" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="88" cy="30" r="3" fill="#e63946"/>
    <circle cx="32" cy="48" r="2.2" fill="#ffffff" fill-opacity="0.7"/>

    <!-- Minimalist Technical Silhouette Bust -->
    <polygon points="20,120 30,84 48,77 72,77 90,84 100,120" fill="#12151c" stroke="#ffffff" stroke-opacity="0.68" stroke-width="1.4"/>
    <polygon points="48,77 60,92 72,77" fill="#090b0f" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1"/>
    <circle cx="60" cy="48" r="15" fill="#0e1118" stroke="#ffffff" stroke-opacity="0.88" stroke-width="1.4"/>

    <!-- Crimson Server Telemetry Bar -->
    <rect x="52" y="102" width="16" height="3" fill="#e63946"/>
    <line x1="46" y1="48" x2="74" y2="48" stroke="#e63946" stroke-opacity="0.75" stroke-width="1.2"/>
  </g>

  <!-- Outer Frame Ring & Corner Markers -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="2" y="58" width="6" height="4" fill="#e63946"/>
  <rect x="112" y="58" width="6" height="4" fill="#ffffff" fill-opacity="0.6"/>
</svg>
