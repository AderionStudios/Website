<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Aderion Studio Logo Mark</title>
  <desc id="logo-desc">Brutalist geometric A monolith emblem for Aderion Studio framed inside a chamfered technical octagon with crimson keystone accents.</desc>

  <!-- Outer Chamfered Technical Octagon Frame -->
  <polygon points="54,18 202,18 238,54 238,202 202,238 54,238 18,202 18,54" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>
  <polygon points="62,28 194,28 228,62 228,194 194,228 62,228 28,194 28,62" fill="none" stroke="#ffffff" stroke-opacity="0.88" stroke-width="2"/>

  <!-- Brutalist Geometric "A" Monolith -->
  <g fill="#ffffff">
    <!-- Left Structural Pillar -->
    <polygon points="114,58 128,58 128,106 94,194 64,194"/>
    <!-- Right Structural Pillar -->
    <polygon points="128,58 142,58 192,194 162,194 128,106"/>
  </g>

  <!-- Crimson Crossbar Keystone & Zenith Core -->
  <polygon points="106,148 150,148 156,170 100,170" fill="#e63946"/>
  <polygon points="128,114 136,126 128,138 120,126" fill="#e63946"/>

  <!-- Hairline Cardinal Reticles -->
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="2">
    <line x1="128" y1="8" x2="128" y2="28"/>
    <line x1="128" y1="228" x2="128" y2="248"/>
    <line x1="8" y1="128" x2="28" y2="128"/>
    <line x1="228" y1="128" x2="248" y2="128"/>
  </g>
</svg>
