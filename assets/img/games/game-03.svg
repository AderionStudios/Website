<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="g3-title g3-desc">
  <title id="g3-title">Echoes of Khora — Game Cover Art</title>
  <desc id="g3-desc">Minimalist isometric brutalist ruin chamber with floating geometric monoliths, light shafts, and a crimson polyhedral core suspended above a dark mirror pool.</desc>
  <defs>
    <linearGradient id="g3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="50%" stop-color="#131317"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="g3-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g3-core-glow" cx="50%" cy="46%" r="36%">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#e63946" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#08080a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#g3-bg)"/>
  <rect width="800" height="500" fill="url(#g3-core-glow)"/>

  <!-- Zenith Light Shaft -->
  <polygon points="315,20 485,20 565,430 235,430" fill="url(#g3-beam)"/>

  <!-- Recessed Brutalist Portal Arches -->
  <g fill="none" stroke="#ffffff">
    <path d="M 160 440 L 160 190 A 240 165 0 0 1 640 190 L 640 440" stroke-opacity="0.12" stroke-width="1"/>
    <path d="M 220 440 L 220 210 A 180 125 0 0 1 580 210 L 580 440" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M 285 440 L 285 230 A 115 80 0 0 1 515 230 L 515 440" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>

  <!-- Floating Isometric Monolith Cubes -->
  <g stroke="#ffffff" stroke-opacity="0.24" stroke-width="1">
    <!-- Left Floating Block -->
    <polygon points="180,220 232,192 284,220 232,248" fill="#1c1c22"/>
    <polygon points="180,220 232,248 232,318 180,290" fill="#121217"/>
    <polygon points="284,220 232,248 232,318 284,290" fill="#0b0b0f"/>

    <!-- Right Floating Block -->
    <polygon points="516,184 568,156 620,184 568,212" fill="#1c1c22"/>
    <polygon points="516,184 568,212 568,292 516,264" fill="#121217"/>
    <polygon points="620,184 568,212 568,292 620,264" fill="#0b0b0f"/>

    <!-- Central Pedestal -->
    <polygon points="336,348 400,316 464,348 400,380" fill="#19191f"/>
    <polygon points="336,348 400,380 400,446 336,414" fill="#101015"/>
    <polygon points="464,348 400,380 400,446 464,414" fill="#09090d"/>
  </g>

  <!-- Suspended Crimson Polyhedron & Orbit Ring -->
  <g transform="translate(400, 224)">
    <ellipse rx="78" ry="22" transform="rotate(-12)" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
    <ellipse rx="78" ry="22" transform="rotate(12)" fill="none" stroke="#e63946" stroke-opacity="0.52" stroke-width="1"/>
    <polygon points="0,-46 34,0 0,46 -34,0" fill="#160b0e" stroke="#e63946" stroke-width="1.8"/>
    <polygon points="0,-46 34,0 0,8" fill="#e63946" fill-opacity="0.55"/>
    <polygon points="0,-46 -34,0 0,8" fill="#ffffff" fill-opacity="0.22"/>
  </g>

  <!-- Mirror Water Reflection Plane -->
  <rect x="20" y="424" width="760" height="56" fill="#060608" fill-opacity="0.88"/>
  <line x1="20" y1="424" x2="780" y2="424" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1"/>
  <g stroke="#e63946" stroke-opacity="0.4" stroke-width="1">
    <line x1="362" y1="442" x2="438" y2="442"/>
    <line x1="378" y1="454" x2="422" y2="454"/>
    <line x1="388" y1="466" x2="412" y2="466"/>
  </g>

  <!-- Editorial Frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="36" y="44" fill="#ffffff" fill-opacity="0.5" font-family="monospace" font-size="11" letter-spacing="2.5">03 // ECHOES OF KHORA</text>
</svg>
