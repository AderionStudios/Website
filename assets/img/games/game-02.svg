<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="g2-title g2-desc">
  <title id="g2-title">Nocturne Signal — Game Cover Art</title>
  <desc id="g2-desc">Minimalist atmospheric sci-fi cover depicting a brutalist transmission tower sending radio waves and crimson frequency anomalies into a nocturnal sky.</desc>
  <defs>
    <linearGradient id="g2-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="62%" stop-color="#0c1016"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <radialGradient id="g2-pulse" cx="62%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="38%" stop-color="#e63946" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <pattern id="g2-scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="8" y2="0" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#g2-bg)"/>
  <rect width="800" height="500" fill="url(#g2-scan)"/>
  <rect width="800" height="500" fill="url(#g2-pulse)"/>

  <!-- Concentric Signal Waves -->
  <g transform="translate(496, 158)" fill="none">
    <circle r="38" stroke="#e63946" stroke-opacity="0.9" stroke-width="1.6"/>
    <circle r="78" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 6"/>
    <circle r="126" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <circle r="184" stroke="#e63946" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="10 8"/>
    <circle r="248" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  </g>

  <!-- Horizon Signal Waveform -->
  <path d="M20 340 L190 340 L215 322 L232 356 L248 292 L266 376 L282 316 L298 340 L452 340 L470 250 L488 394 L506 218 L524 378 L542 308 L560 340 L780 340" fill="none" stroke="#e63946" stroke-opacity="0.72" stroke-width="1.5"/>

  <!-- Brutalist Relay Spire & Dish Structure -->
  <g fill="#0b0d11" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1.1">
    <polygon points="484,452 492,158 500,158 508,452"/>
    <polygon points="452,452 466,276 486,276 476,452"/>
    <polygon points="506,276 526,276 540,452 516,452"/>
    <rect x="462" y="218" width="68" height="10" fill="#13161c"/>
    <rect x="470" y="182" width="52" height="8" fill="#13161c"/>
  </g>
  <line x1="496" y1="158" x2="496" y2="96" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.5"/>
  <circle cx="496" cy="96" r="4" fill="#e63946"/>

  <!-- Orbital Dish Silhouette Left -->
  <g transform="translate(212, 336)" fill="#080a0d" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1">
    <path d="M -52 -46 Q 0 12 52 -46 Z" fill="#101319"/>
    <line x1="0" y1="-26" x2="22" y2="-66" stroke="#ffffff" stroke-opacity="0.35"/>
    <polygon points="-24,114 -10,-16 10,-16 24,114"/>
  </g>

  <!-- Ridges & Ground -->
  <path d="M0 408 L160 382 L310 402 L475 376 L645 398 L800 374 L800 500 L0 500 Z" fill="#060709"/>
  <line x1="0" y1="432" x2="800" y2="432" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Lone Lookout Silhouette -->
  <g transform="translate(332, 396)">
    <rect x="0" y="8" width="10" height="24" rx="2" fill="#0d0f14" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1"/>
    <circle cx="5" cy="4" r="3.2" fill="#0d0f14" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1"/>
  </g>

  <!-- Editorial Frame & Frequency Metadata -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="36" y="44" fill="#ffffff" fill-opacity="0.5" font-family="monospace" font-size="11" letter-spacing="2.5">02 // NOCTURNE SIGNAL</text>
  <text x="615" y="464" fill="#e63946" fill-opacity="0.85" font-family="monospace" font-size="11" letter-spacing="2">FREQ // 047-HZ</text>
</svg>
