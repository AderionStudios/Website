<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="hero-art-title hero-art-desc">
  <title id="hero-art-title">Ashes of Veridia — Monolith Concept Art</title>
  <desc id="hero-art-desc">Dark atmospheric editorial concept illustration depicting a lone wanderer on a basalt cliff facing a towering split brutalist monolith beneath a crimson eclipse.</desc>
  <defs>
    <linearGradient id="hero-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="52%" stop-color="#0e0e13"/>
      <stop offset="82%" stop-color="#191014"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="hero-eclipse-glow" cx="56%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0.45"/>
      <stop offset="28%" stop-color="#e63946" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#3a1218" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-core-beam" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#e63946" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-monolith-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1d24"/>
      <stop offset="60%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="hero-monolith-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27191d"/>
      <stop offset="55%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
    <linearGradient id="hero-mist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161216" stop-opacity="0"/>
      <stop offset="60%" stop-color="#1b1216" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hero-lantern" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
    <pattern id="hero-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Atmospheric Sky & Editorial Grid -->
  <rect width="1200" height="900" fill="url(#hero-sky)"/>
  <rect width="1200" height="900" fill="url(#hero-grid)"/>
  <rect width="1200" height="900" fill="url(#hero-eclipse-glow)"/>

  <!-- Stars / High Altitude Dust -->
  <g fill="#ffffff" fill-opacity="0.45">
    <circle cx="145" cy="92" r="1.2"/>
    <circle cx="238" cy="168" r="1"/>
    <circle cx="312" cy="74" r="1.4"/>
    <circle cx="480" cy="110" r="1"/>
    <circle cx="892" cy="96" r="1.3"/>
    <circle cx="964" cy="176" r="1"/>
    <circle cx="1088" cy="128" r="1.5"/>
    <circle cx="1012" cy="248" r="1.1"/>
    <circle cx="192" cy="264" r="1"/>
  </g>

  <!-- Crimson Eclipse & Orbital Rings -->
  <g transform="translate(672, 336)">
    <circle r="172" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <circle r="218" fill="none" stroke="#e63946" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="6 10"/>
    <circle r="132" fill="#070709" stroke="#e63946" stroke-opacity="0.82" stroke-width="2.2"/>
    <path d="M -132 0 A 132 132 0 0 1 132 0" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <ellipse rx="290" ry="64" transform="rotate(-14)" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
  </g>

  <!-- Far Horizon Mountain Silhouettes -->
  <path d="M0 620 L130 520 L255 568 L390 485 L520 556 L640 495 L790 548 L920 460 L1065 538 L1200 475 L1200 900 L0 900 Z" fill="#0d0d11"/>
  <path d="M0 665 L190 585 L315 628 L465 560 L610 618 L755 572 L910 624 L1060 568 L1200 612 L1200 900 L0 900 Z" fill="#09090c"/>

  <!-- Split Brutalist Monolith -->
  <g>
    <!-- Inner Energy Slit -->
    <rect x="656" y="138" width="32" height="515" fill="url(#hero-core-beam)"/>
    <line x1="672" y1="90" x2="672" y2="660" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.5"/>

    <!-- Left Monolith Slab -->
    <polygon points="562,650 618,145 660,132 660,650" fill="url(#hero-monolith-l)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    <polygon points="588,650 628,210 648,204 648,650" fill="#0a0a0d" fill-opacity="0.7"/>
    <line x1="612" y1="260" x2="660" y2="252" stroke="#e63946" stroke-opacity="0.45" stroke-width="1.5"/>
    <line x1="600" y1="380" x2="660" y2="372" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Right Monolith Slab -->
    <polygon points="684,132 728,150 784,650 684,650" fill="url(#hero-monolith-r)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <polygon points="694,205 718,212 752,650 694,650" fill="#171216" fill-opacity="0.65"/>
    <line x1="684" y1="252" x2="736" y2="262" stroke="#e63946" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="684" y1="372" x2="748" y2="382" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Floating Ruin Shards -->
    <polygon points="528,330 546,304 558,342 540,356" fill="#15151b" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
    <polygon points="798,278 820,256 832,292 806,304" fill="#181317" stroke="#e63946" stroke-opacity="0.45" stroke-width="1"/>
  </g>

  <!-- Valley Mist Overlay -->
  <rect x="0" y="480" width="1200" height="240" fill="url(#hero-mist)"/>

  <!-- Foreground Ruin Spires & Basalt Cliff -->
  <path d="M900 710 L960 578 L992 595 L1035 512 L1085 605 L1140 555 L1200 645 L1200 900 L860 900 Z" fill="#070709" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M0 640 L118 652 L240 676 L348 708 L430 760 L495 900 L0 900 Z" fill="#050507"/>
  <path d="M0 640 L118 652 L240 676 L348 708" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.2"/>
  <path d="M410 900 L615 806 L885 772 L1200 818 L1200 900 Z" fill="#060608"/>

  <!-- Lone Cloaked Wanderer Silhouette & Lantern -->
  <g transform="translate(262, 578)">
    <!-- Ground Glow -->
    <ellipse cx="42" cy="108" rx="48" ry="10" fill="#e63946" fill-opacity="0.22"/>
    <!-- Staff & Lantern -->
    <line x1="42" y1="16" x2="36" y2="108" stroke="#d8d8de" stroke-width="2"/>
    <circle cx="44" cy="24" r="14" fill="#e63946" fill-opacity="0.28"/>
    <circle cx="44" cy="24" r="4.5" fill="url(#hero-lantern)"/>
    <!-- Cloaked Body -->
    <path d="M12 18 C16 6 28 4 30 18 L38 42 L28 96 L8 104 L-12 96 L4 44 Z" fill="#0c0c10" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.2"/>
    <path d="M16 14 L26 14 L23 26 L14 24 Z" fill="#17171d"/>
  </g>

  <!-- Drifting Ash Embers -->
  <g fill="#e63946">
    <circle cx="388" cy="542" r="2.2" fill-opacity="0.85"/>
    <circle cx="442" cy="496" r="1.6" fill-opacity="0.65"/>
    <circle cx="515" cy="574" r="2" fill-opacity="0.7"/>
    <circle cx="624" cy="468" r="1.8" fill-opacity="0.8"/>
    <circle cx="748" cy="490" r="2.4" fill-opacity="0.75"/>
    <circle cx="812" cy="586" r="1.5" fill-opacity="0.6"/>
  </g>

  <!-- Editorial Technical Frame & Telemetry Markings -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1" fill="none">
    <rect x="28" y="28" width="1144" height="844"/>
    <path d="M28 72 L72 72 M1128 72 L1172 72 M28 828 L72 828 M1128 828 L1172 828"/>
    <circle cx="672" cy="336" r="4" stroke="#e63946" stroke-opacity="0.85"/>
    <path d="M652 336 L664 336 M680 336 L692 336 M672 316 L672 328 M672 344 L672 356" stroke="#ffffff" stroke-opacity="0.35"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.45" font-family="monospace" font-size="12" letter-spacing="3">
    <text x="48" y="56">SEC-01 // VERIDIA MONOLITH</text>
    <text x="955" y="56">PROJECT 001 — ARCHIVE</text>
    <text x="48" y="856">BUILD v0.9.4 // CONCEPT PLATE</text>
  </g>
</svg>
