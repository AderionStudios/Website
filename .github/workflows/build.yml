name: CI — Typecheck, Build & Guardrails

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Typecheck & Compile TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Enforce zero raw JavaScript under src/
        run: |
          raw_js=$(find src -type f \( -name "*.js" -o -name "*.jsx" -o -name "*.mjs" -o -name "*.cjs" \))
          if [ -n "$raw_js" ]; then
            echo "::error::Raw handwritten JavaScript files are forbidden under src/ (TypeScript-Only policy):"
            echo "$raw_js"
            exit 1
          fi

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build TypeScript to assets/js/
        run: npm run build

      - name: Verify compiled static JavaScript outputs
        run: |
          for file in assets/js/main.js assets/js/config.js assets/js/i18n.js; do
            if [ ! -s "$file" ]; then
              echo "::error::Expected compiled output missing or empty: $file"
              exit 1
            fi
          done
          echo "Verified generated artifacts: assets/js/main.js, assets/js/config.js, assets/js/i18n.js"

      - name: Validate XML (sitemap.xml)
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('XML validation passed.')"
