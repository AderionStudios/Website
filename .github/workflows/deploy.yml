name: CD — Deploy Static Site to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Sync Production Files to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies & compile TypeScript
        run: npm install && npm run build

      - name: Verify TypeScript-Only policy & production artifacts
        run: |
          raw_js=$(find src -type f \( -name "*.js" -o -name "*.jsx" -o -name "*.mjs" -o -name "*.cjs" \))
          if [ -n "$raw_js" ]; then
            echo "::error::Raw handwritten JavaScript files found under src/:"
            echo "$raw_js"
            exit 1
          fi

          required_files=(
            "index.html"
            "credit.html"
            "games.html"
            ".htaccess"
            "robots.txt"
            "sitemap.xml"
            "favicon.ico"
            "assets/js/main.js"
            "assets/js/config.js"
            "assets/js/i18n.js"
            "assets/css/variables.css"
            "assets/css/main.css"
            "assets/css/responsive.css"
            "assets/css/vrchat-theme.css"
            "assets/img/team/logo-mark.svg"
            "assets/img/team/logo-mark.png"
            "assets/img/team/logo-full.png"
          )

          for file in "${required_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Required production file is missing or empty: $file"
              exit 1
            fi
          done

      - name: Stage clean static production bundle
        run: |
          rm -rf _deploy
          mkdir -p _deploy
          cp index.html credit.html games.html .htaccess robots.txt sitemap.xml favicon.ico _deploy/
          cp -r assets _deploy/assets
          echo "Staged files for deployment:"
          ls -la _deploy/

      - name: Validate cPanel SSH secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          missing=0
          for var in CPANEL_HOST CPANEL_USER CPANEL_SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required GitHub Secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy staged bundle to cPanel public_html via SSH/rsync
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_REMOTE_PATH: ${{ secrets.CPANEL_REMOTE_PATH }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          PORT="${CPANEL_PORT:-22}"
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::CPANEL_PORT must be a numeric port number."
            exit 1
          fi

          REMOTE_DIR="${CPANEL_REMOTE_PATH:-public_html/}"
          case "$REMOTE_DIR" in
            */) ;;
            *) REMOTE_DIR="${REMOTE_DIR}/" ;;
          esac

          SSH_TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$SSH_TMP_DIR"' EXIT
          chmod 700 "$SSH_TMP_DIR"

          SSH_KEY_FILE="$SSH_TMP_DIR/id_deploy"
          KNOWN_HOSTS_FILE="$SSH_TMP_DIR/known_hosts"

          printf '%s\n' "$CPANEL_SSH_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"

          if [ -n "${CPANEL_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          else
            ssh-keyscan -p "$PORT" -H "$CPANEL_HOST" > "$KNOWN_HOSTS_FILE"
          fi
          chmod 600 "$KNOWN_HOSTS_FILE"

          rsync -avz --delete --checksum \
            --chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            --exclude='.cpanel/' \
            --exclude='error_log' \
            -e "ssh -i $SSH_KEY_FILE -p $PORT -o UserKnownHostsFile=$KNOWN_HOSTS_FILE -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            _deploy/ "${CPANEL_USER}@${CPANEL_HOST}:${REMOTE_DIR}"

          # Note: For cPanel hosts without SSH access, replace this step with
          # an FTPS deployment action targeting ./_deploy/ (protocol: ftps).
