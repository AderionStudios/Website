name: Deploy to cPanel (FTPS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Site QA
        run: python3 scripts/qa-check.py

      - name: Install Python QA tools
        run: pip install ruff flake8 mypy bandit

      - name: Python Strict QA
        run: |
          ruff check --select ALL --ignore D203,D213 scripts/qa-check.py scripts/bump-version.py
          flake8 --max-line-length=88 --max-complexity=10 scripts/qa-check.py scripts/bump-version.py
          mypy --strict --ignore-missing-imports scripts/qa-check.py scripts/bump-version.py
          bandit -r scripts/qa-check.py scripts/bump-version.py -ll -ii

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs, phpstan, php-cs-fixer, composer

      - name: PHP Strict QA
        run: |
          for f in api/*.php; do php -l "$f"; done
          phpcs --standard=phpcs.xml
          phpstan analyse --configuration=phpstan.neon --no-progress
          php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php
          if [ -f composer.lock ]; then composer audit --locked; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS / CSS / HTML / XML QA tools
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          npm install -g @biomejs/biome eslint stylelint stylelint-config-standard htmlhint

      - name: JS / CSS / JSON / HTML / XML Strict QA
        run: |
          biome check --error-on-warnings
          eslint . --max-warnings=0
          stylelint "assets/*.css" --max-warnings=0
          if [ -f tsconfig.json ]; then npx tsc --noEmit --strict; fi
          htmlhint index.html visual-novel.html studio.html credits.html join.html
          xmllint --noout sitemap.xml

      - name: SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config=auto --error --severity=WARNING .

  deploy:
    needs: qa
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VER" != "$FILE_VER" ]; then
            echo "::error::Tag version ($TAG_VER) does not match VERSION file ($FILE_VER)"
            exit 1
          fi
          echo "Verified tag v$TAG_VER matches VERSION ($FILE_VER)"

      - name: Sync files to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Direct IP connections often have a TLS cert issued to the server hostname
          security: loose
          # Dedicated cPanel FTP account rooted at public_html uses "./"
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            scripts/**
            docs/**
            update-credits.bat
            *.md
            *.log
            **/*.log
            requirements*.txt
            api/smtp_config.php
            api/discord_config.php
            biome.json
            eslint.config.mjs
            .stylelintrc.json
            .htmlhintrc
            phpstan.neon
            phpcs.xml
            .php-cs-fixer.dist.php
